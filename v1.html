<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fi3tj3n-prog</title>
<meta name="theme-color" content="#05060f">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05060f; color: #eef; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; pointer-events: none; }
  .hello { font-size: 14px; letter-spacing: .4em; text-transform: uppercase; opacity: .6; margin-bottom: 14px; }
  h1 { font-size: clamp(40px, 13vw, 110px); font-weight: 800; line-height: 1; letter-spacing: -.03em;
       background: linear-gradient(90deg, #7af, #c7f, #f7a, #fc6, #7fd, #7af); background-size: 300% 100%;
       -webkit-background-clip: text; background-clip: text; color: transparent; animation: shift 8s linear infinite;
       filter: drop-shadow(0 0 30px rgba(160,120,255,.35)); }
  @keyframes shift { to { background-position: 300% 0; } }
  .type { margin-top: 18px; font-size: clamp(16px, 4.6vw, 22px); min-height: 1.5em; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #cfd6ff; }
  .type::after { content: "▍"; margin-left: 2px; animation: blink 1s steps(1) infinite; color: #c7f; }
  @keyframes blink { 50% { opacity: 0; } }
  .hint { position: fixed; bottom: calc(28px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 13px; opacity: .55; pointer-events: none; animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); opacity: .85; } }
  .count { position: fixed; top: calc(16px + env(safe-area-inset-top)); right: 18px; font: 12px ui-monospace, Menlo, monospace; opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="hello">hello, world — saya</div>
  <h1>fi3tj3n-prog</h1>
  <div class="type" id="type"></div>
</div>
<div class="count" id="count">ledakan: 0</div>
<div class="hint">✨ sentuh &amp; geser layar ✨</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, W, H);
}
addEventListener('resize', resize); resize();

// Arus partikel yang mengalir mengikuti "medan" yang terus berubah
const N = Math.min(1400, Math.floor(W * H / 450));
const parts = [];
function spawn(p) { p.x = Math.random() * W; p.y = Math.random() * H; p.life = 60 + Math.random() * 200; p.vx = p.vx || 0; p.vy = p.vy || 0; return p; }
for (let i = 0; i < N; i++) parts.push(spawn({ vx: 0, vy: 0 }));

const sparks = [];
const pointer = { x: -9999, y: -9999, down: false };
let t = 0, hue = 220, bursts = 0;

function field(x, y) {
  const s = 0.0028;
  return Math.sin(x * s + t * 0.6) * 1.7 + Math.cos(y * s * 1.3 - t * 0.4) * 1.7 + Math.sin((x + y) * s * 0.7 + t * 0.25) * 1.2;
}

function burst(x, y) {
  bursts++; document.getElementById('count').textContent = 'ledakan: ' + bursts;
  const h = Math.random() * 360, n = 90;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, sp = 2 + Math.random() * 6;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, h: h + Math.random() * 60 });
  }
  if (navigator.vibrate) navigator.vibrate(15);
}

function pos(e) { const p = e.touches ? e.touches[0] : e; return p ? { x: p.clientX, y: p.clientY } : null; }
function down(e) { const p = pos(e); if (!p) return; pointer.x = p.x; pointer.y = p.y; pointer.down = true; burst(p.x, p.y); }
function move(e) { const p = pos(e); if (!p) return; pointer.x = p.x; pointer.y = p.y; }
function up() { pointer.down = false; setTimeout(() => { if (!pointer.down) { pointer.x = pointer.y = -9999; } }, 600); }
cv.addEventListener('pointerdown', down);
addEventListener('pointermove', move);
addEventListener('pointerup', up);
addEventListener('touchstart', e => e.preventDefault(), { passive: false });

function frame() {
  t += 0.01; hue = (hue + 0.15) % 360;
  ctx.fillStyle = 'rgba(5,6,15,0.08)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  for (const p of parts) {
    const a = field(p.x, p.y);
    p.vx = p.vx * 0.9 + Math.cos(a) * 0.35;
    p.vy = p.vy * 0.9 + Math.sin(a) * 0.35;
    const dx = pointer.x - p.x, dy = pointer.y - p.y, d2 = dx * dx + dy * dy;
    if (d2 < 32000) { // pusaran di sekitar jari
      const d = Math.sqrt(d2) + 1, f = (1 - d2 / 32000) * 1.6;
      p.vx += (-dy / d) * f + (dx / d) * f * 0.35;
      p.vy += (dx / d) * f + (dy / d) * f * 0.35;
    }
    const ox = p.x, oy = p.y;
    p.x += p.vx; p.y += p.vy;
    if (--p.life < 0 || p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) { spawn(p); continue; }
    const sp = Math.min(1, Math.hypot(p.vx, p.vy) / 4);
    ctx.strokeStyle = `hsla(${(hue + p.x * 0.08 + p.y * 0.05) % 360},90%,${45 + sp * 30}%,${0.25 + sp * 0.5})`;
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(p.x, p.y); ctx.stroke();
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.vx *= 0.96; s.vy = s.vy * 0.96 + 0.06;
    const ox = s.x, oy = s.y;
    s.x += s.vx; s.y += s.vy; s.life -= 0.014;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.strokeStyle = `hsla(${s.h},100%,65%,${s.life})`;
    ctx.lineWidth = 2 * s.life + 0.5;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(s.x, s.y); ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
frame();

// Teks mengetik sendiri
const lines = [
  'baru mulai ngoding.',
  'repo pertama: belajar-pertama',
  'dibuat 20 November 2026',
  'setiap ahli dulunya pemula.',
  'ini baru awal. 🚀'
];
const el = document.getElementById('type');
let li = 0, ci = 0, del = false;
(function typeLoop() {
  const s = lines[li];
  el.textContent = s.slice(0, ci);
  if (!del && ci < s.length) { ci++; setTimeout(typeLoop, 55 + Math.random() * 60); }
  else if (!del) { del = true; setTimeout(typeLoop, 1700); }
  else if (ci > 0) { ci--; setTimeout(typeLoop, 25); }
  else { del = false; li = (li + 1) % lines.length; setTimeout(typeLoop, 300); }
})();

setTimeout(() => burst(W / 2, H * 0.32), 700);
</script>
</body>
</html>
