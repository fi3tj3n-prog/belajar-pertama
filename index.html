<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #04030a; color: #eef; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .top { position: fixed; top: calc(34px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; padding: 0 20px; pointer-events: none; }
  .hello { font-size: 12px; letter-spacing: .45em; text-transform: uppercase; opacity: .55; margin-bottom: 10px; }
  h1 { font-size: clamp(34px, 11vw, 84px); font-weight: 800; line-height: 1; letter-spacing: -.03em;
       background: linear-gradient(90deg, #8af, #c8f, #f8b, #fd8, #8fe, #8af); background-size: 300% 100%;

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;
uniform float T;
uniform vec2 A;
uniform float P;
uniform vec4 RP[6];
uniform sampler2D IMG;
uniform float HAS;
uniform float IMGA;

const vec3 IA = vec3(0.86, 0.82, 0.9);
const vec3 IB = vec3(0.22);
const vec3 ID = vec3(0.0, 0.33, 0.67);

float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float n3(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * n3(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return s; }

// Gradasi warna dari bawah ke atas: emas -> pink senja -> mint lavender -> biru es
vec3 m4(vec3 a, vec3 b, vec3 c, vec3 d, float k){
  float x = clamp(k, 0.0, 1.0) * 3.0;
  if (x < 1.0) return mix(a, b, smoothstep(0.0, 1.0, x));
  if (x < 2.0) return mix(b, c, smoothstep(0.0, 1.0, x - 1.0));
  return mix(c, d, smoothstep(0.0, 1.0, x - 2.0));
}
vec3 P0(float k){ return m4(vec3(0.03,0.02,0.01), vec3(0.38,0.2,0.34), vec3(0.1,0.08,0.18), vec3(0.01,0.025,0.06), k); }
vec3 P1(float k){ return m4(vec3(0.3,0.19,0.07), vec3(1.3,0.55,0.75), vec3(0.6,0.45,1.0), vec3(0.08,0.22,0.45), k); }
vec3 P2(float k){ return m4(vec3(0.9,0.62,0.22), vec3(1.6,0.95,0.6), vec3(0.45,1.2,1.0), vec3(0.45,0.75,1.0), k); }
vec3 P3(float k){ return m4(vec3(1.0,0.78,0.4), vec3(1.0,0.85,1.2), vec3(1.0,0.85,1.0), vec3(0.85,0.95,1.0), k); }

vec3 sky(vec3 d){
  vec3 q = d * 1.8;
  float w = fbm(q + vec3(0.0, 0.0, T * 0.04));
  float n = fbm(q * 1.3 + w * 2.2 + vec3(T * 0.03, 0.0, 0.0));
  float k = d.y * 0.95 + 0.5 + (w - 0.5) * 0.35;
  vec3 c = P0(k);
  c = mix(c, P1(k), smoothstep(0.25, 0.65, n));
  c = mix(c, P2(k), smoothstep(0.5, 0.8, n * w * 1.6));
  c += P3(k) * pow(smoothstep(0.45, 0.9, n), 3.0) * 0.9;
  vec3 g = d * 180.0; float s = h3(floor(g));
  c += vec3(1.0) * step(0.996, s) * smoothstep(0.6, 0.2, length(fract(g) - 0.5)) * (0.6 + 0.4 * sin(T * 3.0 + s * 100.0)) * smoothstep(0.4, 0.7, k);
  return c;
}


vec3 tm(vec3 c){
  c = c / (1.0 + c);
  c = pow(c, vec3(0.85));
  return mix(vec3(dot(c, vec3(0.299, 0.587, 0.114))), c, 1.3);
}

// Foto ditaruh di bidang di tengah bola, menghadap kamera.
// Sinar yang dibiaskan permukaan kaca menembus bidang ini, jadi foto terlihat seperti di dalam bola kaca.
vec3 ballPhoto(vec3 p, vec3 rr, vec3 cr, vec3 cu, vec3 cf){
  float s = max(-dot(p, cf) / max(dot(rr, cf), 0.05), 0.0);
  vec3 x = p + rr * s;
  vec2 c = vec2(dot(x, cr), dot(x, cu)) / 1.05 * 0.5;
  if (IMGA > 1.0) c.x /= IMGA; else c.y *= IMGA;
  return texture2D(IMG, clamp(c + 0.5, 0.001, 0.999)).rgb;
}

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }

float map(vec3 p){
  float d = length(p) - 0.75;
  for (int i = 0; i < 4; i++) {
    float fi = float(i);
    vec3 c = vec3(sin(T * 0.7 + fi * 1.7), cos(T * 0.9 + fi * 2.3), sin(T * 0.5 + fi * 3.1)) * (0.75 + 0.25 * sin(T * 0.3 + fi));
    d = smin(d, length(p - c * 0.8) - (0.32 + 0.06 * fi), 0.45);
  }
  d += sin(p.x * 5.0 + T * 2.0) * sin(p.y * 5.0 + T * 1.7) * sin(p.z * 5.0 + T * 1.3) * (0.03 + 0.07 * P);
  return d;
}
vec3 nrm(vec3 p){
  vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx)));
}

void main(){
  float mn = min(R.x, R.y);
  vec2 uv = (gl_FragCoord.xy - 0.5 * R) / mn;

  // gelombang dari setiap sentuhan
  vec3 rc = vec3(0.0);
  for (int i = 0; i < 6; i++) {
    vec4 r = RP[i];
    float age = T - r.z;
    if (age > 0.0 && age < 3.0) {
      vec2 dv = uv - r.xy;
      float dl = length(dv);
      float ring = dl - age * 0.55;
      float w = exp(-ring * ring * 300.0) * exp(-age * 1.4);
      uv -= dv / (dl + 0.001) * w * 0.03;
      rc += (IA + IB * cos(6.2831 * (r.w + ID))) * w * 0.5;
    }
  }

  vec3 ro = vec3(0.0, 0.0, 5.6 - 1.3 * HAS);
  vec3 rd = normalize(vec3(uv, -1.6));
  mat2 ry = rot(A.x), rx = rot(A.y);
  ro.yz *= rx; rd.yz *= rx; ro.xz *= ry; rd.xz *= ry;
  vec3 cr = vec3(1.0, 0.0, 0.0), cu = vec3(0.0, 1.0, 0.0), cf = vec3(0.0, 0.0, -1.0);
  cr.yz *= rx; cu.yz *= rx; cf.yz *= rx; cr.xz *= ry; cu.xz *= ry; cf.xz *= ry;

  float t = 0.0, md = 1e3; bool hit = false;
  for (int i = 0; i < 70; i++) {
    float d = map(ro + rd * t); md = min(md, d);
    if (d < 0.001) { hit = true; break; }
    t += d * 0.9; if (t > 12.0) break;
  }

  vec3 col, add = vec3(0.0);
  if (hit) {
    vec3 p = ro + rd * t, n = nrm(p);
    float fr = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    vec3 l = normalize(vec3(0.6, 0.8, 0.5));
    float dif = max(dot(n, l), 0.0);
    float spec = pow(max(dot(reflect(rd, n), l), 0.0), 40.0);
    vec3 ir = IA + IB * cos(6.2831 * (fr * 1.2 + dot(n, vec3(0.3, 0.5, 0.2)) + T * 0.08 + ID));
    vec3 rim = P3(n.y * 0.5 + 0.5);
    if (HAS > 0.5) {
      add = ballPhoto(p, refract(rd, n, 0.9), cr, cu, cf) * (1.0 - fr * 0.85);
      col = sky(reflect(rd, n)) * fr * 0.9 + rim * fr * 0.4 + spec * 1.4;
    } else {
      vec3 refl = sky(reflect(rd, n));
      col = ir * (0.38 + 0.5 * dif) + refl * (0.2 + 0.8 * fr) + rim * fr * 0.7 + spec * 1.6;
    }
  } else {
    col = sky(rd);
    col += (IA + IB * cos(6.2831 * (ID + T * 0.05))) * exp(-md * 6.0) * 0.35 * (1.0 + P) * (HAS > 0.5 ? 0.5 : 1.0);
  }
  col += rc;
  float vig = 1.0 - 0.18 * dot(uv, uv);
  gl_FragColor = vec4(clamp(tm(col * vig) + add * vig, 0.0, 1.0), 1.0);
}
</script>

<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, alpha: false });
if (!gl) { document.getElementById('err').style.display = 'flex'; document.getElementById('intro').remove(); throw 0; }

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const uR = U('R'), uT = U('T'), uA = U('A'), uP = U('P'), uRP = U('RP'), uHAS = U('HAS'), uIMGA = U('IMGA');

// ---------- Foto ----------
// Foto hanya diproses di HP-mu sendiri, tidak diunggah ke mana pun.
const tex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
[gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.uniform1i(U('IMG'), 0);
let hasPhoto = 0, imgAspect = 1;
const photoBtn = document.getElementById('photoBtn'), fileIn = document.getElementById('file');
photoBtn.addEventListener('click', () => {
  if (hasPhoto) { hasPhoto = 0; photoBtn.textContent = '📷 Pasang foto'; tap(innerWidth / 2, innerHeight / 2); return; }
  fileIn.click();
});
fileIn.addEventListener('change', () => {
  const f = fileIn.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 4096);
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    imgAspect = c.width / c.height; hasPhoto = 1;
    photoBtn.textContent = '✕ Hapus foto';
    URL.revokeObjectURL(img.src); fileIn.value = '';
    tap(innerWidth / 2, innerHeight / 2);
  };
  img.src = URL.createObjectURL(f);
});

// Resolusi menyesuaikan kemampuan HP supaya tetap mulus
const DPR = Math.min(window.devicePixelRatio || 1, 3);
let scale = DPR * 0.8;
const minScale = Math.max(0.6, DPR * 0.45);
function resize() {
  cv.width = Math.max(1, Math.round(innerWidth * scale));
  cv.height = Math.max(1, Math.round(innerHeight * scale));
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize); resize();

const ripples = new Float32Array(24).fill(-99);
let rIdx = 0, pulse = 0, notes = 0;
const drag = { x: 0, y: 0 }, tilt = { x: 0, y: 0 }, cam = { x: 0, y: 0 };
let ptr = null;
const t0 = performance.now();
const now = () => (performance.now() - t0) / 1000;

// ---------- Suara ----------
let ac, out;
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  out = ac.createGain(); out.gain.value = 0.5;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3500;
  const dl = ac.createDelay(1); dl.delayTime.value = 0.33;
  const fb = ac.createGain(); fb.gain.value = 0.4;
  out.connect(lp); out.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(lp);
  lp.connect(ac.destination);
}
const PENTA = [0, 2, 4, 7, 9];
function play(x, y) {
  const i = Math.min(9, Math.floor(x / innerWidth * 10));
  const semi = PENTA[i % 5] + 12 * Math.floor(i / 5) + (y < innerHeight / 2 ? 12 : 0);
  if (!ac) return i;
  const f = 196 * Math.pow(2, semi / 12), tt = ac.currentTime;
  [[f, 'sine', 0.28], [f * 2, 'triangle', 0.06], [f * 1.003, 'sine', 0.12]].forEach(([fr, type, g]) => {
    const o = ac.createOscillator(), e = ac.createGain();
    o.type = type; o.frequency.value = fr;
    e.gain.setValueAtTime(0, tt); e.gain.linearRampToValueAtTime(g, tt + 0.012);
    e.gain.exponentialRampToValueAtTime(0.0001, tt + 2.2);
    o.connect(e); e.connect(out); o.start(tt); o.stop(tt + 2.3);
  });
  return i;
}

function tap(x, y) {
  const i = play(x, y);
  const o = rIdx * 4;
  const m = Math.min(innerWidth, innerHeight);
  ripples[o] = (x - innerWidth / 2) / m;
  ripples[o + 1] = (innerHeight / 2 - y) / m;
  ripples[o + 2] = now();
  ripples[o + 3] = i / 10;
  rIdx = (rIdx + 1) % 6;
  pulse = 1;
  document.getElementById('count').textContent = 'nada: ' + (++notes);
  if (navigator.vibrate) navigator.vibrate(10);
}

cv.addEventListener('pointerdown', e => { ptr = { x: e.clientX, y: e.clientY }; tap(e.clientX, e.clientY); });
addEventListener('pointermove', e => {
  if (!ptr) return;
  drag.x += (e.clientX - ptr.x) * 0.006;
  drag.y = Math.max(-1.2, Math.min(1.2, drag.y + (e.clientY - ptr.y) * 0.006));
  ptr = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => ptr = null);
addEventListener('pointercancel', () => ptr = null);

addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  tilt.x = e.gamma / 90 * 0.9;
  tilt.y = ((e.beta || 45) - 45) / 90 * 0.9;
});

document.getElementById('start').addEventListener('click', async () => {
  try { initAudio(); await ac.resume(); } catch (_) {}
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (_) {}
  const intro = document.getElementById('intro');
  intro.style.opacity = 0; setTimeout(() => intro.remove(), 800);
  setTimeout(() => tap(innerWidth / 2, innerHeight * 0.55), 300);
});

// ---------- Animasi ----------
let frames = 0, acc = 0, last = performance.now();
function frame(ts) {
  const dt = ts - last; last = ts;
  frames++; acc += dt;
  if (frames === 40) { if (acc / 40 > 30 && scale > minScale) { scale = Math.max(minScale, scale * 0.85); resize(); } frames = 0; acc = 0; }

  const T = now();
  pulse *= 0.96;
  const tx = drag.x + tilt.x + T * 0.08, ty = drag.y + tilt.y;
  cam.x += (tx - cam.x) * 0.08; cam.y += (ty - cam.y) * 0.08;

  draw(T);
  requestAnimationFrame(frame);
}
function draw(T) {
  gl.uniform2f(uR, cv.width, cv.height);
  gl.uniform1f(uT, T);
  gl.uniform2f(uA, cam.x, cam.y);
  gl.uniform1f(uP, pulse);
  gl.uniform4fv(uRP, ripples);
  gl.uniform1f(uHAS, hasPhoto);
  gl.uniform1f(uIMGA, imgAspect);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------- Simpan wallpaper ----------
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg; t.style.opacity = 1;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.opacity = 0, 3500);
}
document.getElementById('saveBtn').addEventListener('click', () => {
  const d = window.devicePixelRatio || 1;
  const w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  ripples.fill(-99); pulse = 0;
  cv.width = w; cv.height = h; gl.viewport(0, 0, w, h);
  draw(now());
  const url = cv.toDataURL('image/png');
  resize();
  const a = document.createElement('a');
  a.href = url; a.download = 'wallpaper-' + Date.now() + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('💾 Tersimpan (' + w + '×' + h + ')<br>Cek folder Download, lalu pasang dari Galeri');
});
requestAnimationFrame(frame);

// ---------- Teks mengetik ----------
const lines = [
  'versi 3: semua warna jadi satu 🌈',
  '📷 pasang fotomu → masuk ke bola kaca 3D',
  '💾 simpan jadi wallpaper HP',
  'sentuh layar = main musik 🎵',
  'geser = putar bola kristal',
  'miringkan HP = lihat sekeliling',
  '100% WebGL, tanpa library.',
  'ini baru awal. 🚀'
];
const el = document.getElementById('type');
let li = 0, ci = 0, del = false;
(function typeLoop() {
  const s = lines[li];
  el.textContent = s.slice(0, ci);
  if (!del && ci < s.length) { ci++; setTimeout(typeLoop, 50 + Math.random() * 55); }
  else if (!del) { del = true; setTimeout(typeLoop, 1800); }
  else if (ci > 0) { ci--; setTimeout(typeLoop, 22); }
  else { del = false; li = (li + 1) % lines.length; setTimeout(typeLoop, 300); }
})();
</script>
</body>
</html>
